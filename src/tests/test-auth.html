<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .oauth-btn { padding: 15px 30px; margin: 10px; border: none; border-radius: 5px; cursor: pointer; }
        .google-btn { background: #4285f4; color: white; }
        .kakao-btn { background: #fee500; color: black; }
        .naver-btn { background: #03c75a; color: white; }
    </style>
</head>
<body>
    <h1>Drop Master Authentication Test</h1>
    
    <div class="test-section">
        <h2>Current Status</h2>
        <div id="status">Checking...</div>
        <div id="user-info"></div>
    </div>

    <div class="test-section">
        <h2>OAuth Login Tests</h2>
        <p>Click the buttons below to test OAuth login:</p>
        <button class="oauth-btn google-btn" onclick="testGoogleLogin()">Google 로그인 테스트</button>
        <button class="oauth-btn kakao-btn" onclick="testKakaoLogin()">카카오 로그인 테스트</button>
        <button class="oauth-btn naver-btn" onclick="testNaverLogin()">네이버 로그인 테스트</button>
    </div>

    <div class="test-section">
        <h2>Token Management</h2>
        <button onclick="checkToken()">토큰 확인</button>
        <button onclick="clearToken()">토큰 삭제</button>
        <button onclick="testProfile()">프로필 조회 테스트</button>
        <button onclick="testDirectLogin()">직접 로그인 테스트</button>
        <div id="token-info"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3001/api';
        
        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<span class="${type}">${message}</span>`;
        }

        function updateUserInfo(user) {
            const userDiv = document.getElementById('user-info');
            if (user) {
                userDiv.innerHTML = `
                    <h3>사용자 정보:</h3>
                    <p><strong>이름:</strong> ${user.name}</p>
                    <p><strong>이메일:</strong> ${user.email}</p>
                    <p><strong>프로바이더:</strong> ${user.provider || 'standard'}</p>
                `;
            } else {
                userDiv.innerHTML = '<p>로그인되지 않음</p>';
            }
        }

        function checkToken() {
            const token = localStorage.getItem('token');
            const tokenDiv = document.getElementById('token-info');
            if (token) {
                tokenDiv.innerHTML = `<p class="success">토큰 존재: ${token.substring(0, 20)}...</p>`;
            } else {
                tokenDiv.innerHTML = '<p class="error">토큰 없음</p>';
            }
        }

        function clearToken() {
            localStorage.removeItem('token');
            updateStatus('토큰 삭제됨', 'success');
            updateUserInfo(null);
            checkToken();
        }

        async function testProfile() {
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    updateStatus('토큰이 없습니다', 'error');
                    return;
                }

                const response = await fetch(`${API_BASE_URL}/auth/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();
                
                if (data.success) {
                    updateStatus('프로필 조회 성공', 'success');
                    updateUserInfo(data.data.user);
                } else {
                    updateStatus(`프로필 조회 실패: ${data.message}`, 'error');
                }
            } catch (error) {
                updateStatus(`프로필 조회 오류: ${error.message}`, 'error');
            }
        }

        function testGoogleLogin() {
            window.location.href = `${API_BASE_URL}/auth/google`;
        }

        function testKakaoLogin() {
            window.location.href = `${API_BASE_URL}/auth/kakao`;
        }

        function testNaverLogin() {
            window.location.href = `${API_BASE_URL}/auth/naver`;
        }

        function testDirectLogin() {
            // Test direct login with email/password
            const email = prompt('Enter email:');
            const password = prompt('Enter password:');
            
            if (email && password) {
                fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem('token', data.data.token);
                        updateStatus('Direct login successful!', 'success');
                        updateUserInfo(data.data.user);
                        checkToken();
                    } else {
                        updateStatus(`Login failed: ${data.message}`, 'error');
                    }
                })
                .catch(error => {
                    updateStatus(`Login error: ${error.message}`, 'error');
                });
            }
        }

        // Initialize
        window.onload = function() {
            checkToken();
            const token = localStorage.getItem('token');
            if (token) {
                updateStatus('토큰 발견됨', 'success');
                testProfile();
            } else {
                updateStatus('토큰 없음 - 로그인이 필요합니다', 'info');
            }
        };
    </script>
</body>
</html>
